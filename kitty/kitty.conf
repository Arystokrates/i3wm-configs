# Kitty Terminal Config - Matching i3 Theme with Gaps

# Basic settings
enable_audio_bell no
confirm_os_window_close 0

# Font
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window layout (matching your 10px gaps)
window_margin_width 10
single_window_margin_width 10
window_padding_width 5
hide_window_decorations titlebar-only
remember_window_size  yes
initial_window_width  900
initial_window_height 600

# Background opacity (matches Picom transparency)
background_opacity 0.9
dynamic_background_opacity yes

# Colors - Matching your i3 theme
foreground #ffffff
background #121212
selection_foreground #ffffff
selection_background #5e0000

# Color palette
# Black
color0  #383838
color8  #fff200
# color8  #383838

# Red
color1  #ff0000
color9  #ff0000

# Dark Red
color2  #fff200
color10 #5e0000

# White
color7  #ffffff
color15 #ffffff

# Swapped blue for neofetch color
color6 #ff0000
# color15 #ff0000

# Tab bar (matches i3 window colors)
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #ffffff
active_tab_background   #5e0000
active_tab_font_style   bold
inactive_tab_foreground #ffffff
inactive_tab_background #383838
tab_bar_background      #000000
tab_bar_margin_width    10

# Cursor
cursor                  #ff0000
cursor_text_color       #000000
cursor_shape            beam
cursor_beam_thickness   1.5

# URL style
url_color #ff0000
url_style curly

# Keyboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

# Window border (matches i3)
active_border_color   #5e0000
inactive_border_color #383838
bell_border_color     #ff0000